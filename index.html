  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

urce Serif 4';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"14034fdf-e36e-4d86-a88f-e92be6b69b65\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<style>\n  * { box-sizing: border-box; }\n  html { scroll-behavior: smooth; }\n  body { margin: 0; background: #FFFFFF; color: #1A1A22; font-family: 'Inter', system-ui, -apple-system, sans-serif; -webkit-font-smoothing: antialiased; }\n  a { color: #1C4C96; text-decoration: none; }\n  a:hover { color: #534AB7; }\n  input, textarea, select, button { font-family: inherit; }\n  @media print { [data-chrome] { display: none !important; } }\n<\u002Fstyle>\n<script src=\"117fd864-1357-4d7b-8e02-85910f6aa81a\"><\u002Fscript>\n<script src=\"7888003a-3f71-47fa-a765-fd16aa563c0a\"><\u002Fscript>\n<\u002Fhelmet>\n\n<div data-screen-label=\"Portada\" style=\"background:#16306B;padding:30px 0 32px\">\n  <div style=\"max-width:1140px;margin:0 auto;padding:0 clamp(20px,4vw,40px)\">\n    <div style=\"display:flex;align-items:center;gap:12px;margin-bottom:16px\">\n      <img src=\"dd582faf-8255-4954-a00c-2395f32e00cf\" alt=\"IEFPI\" style=\"height:44px;width:auto;display:block\">\n      <div>\n        <div style=\"font-size:10.5px;font-weight:800;letter-spacing:.15em;text-transform:uppercase;color:#E0A52E;line-height:1.1\">IEFPI · Diplomado 020-26 · Módulo IV<\u002Fdiv>\n        <div style=\"font-size:11.5px;font-weight:600;color:rgba(255,255,255,.7);margin-top:3px\">Unidad 1 · Tema 4 de 4 — Recurso asíncrono para los RA 8.5 y 8.6<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px\">\n      <div style=\"display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.28);border-radius:100px;padding:5px 14px\">\n        <span style=\"font-size:13px;color:#FFFFFF\">●<\u002Fspan>\n        <span style=\"font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:#FFFFFF\">Zona troncal común<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"display:inline-flex;align-items:center;gap:8px;background:rgba(224,165,46,.16);border:1px solid rgba(224,165,46,.5);border-radius:100px;padding:5px 14px\">\n        <span style=\"font-size:13px;color:#E0A52E\">★<\u002Fspan>\n        <span style=\"font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:#FFFFFF\">Matiz de ejecución máxima en 4.4<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <h1 style=\"font-size:clamp(25px,3.2vw,36px);font-weight:800;letter-spacing:-.02em;line-height:1.1;color:#FFFFFF;margin:0 0 12px;max-width:34ch\">Herramientas del stack y dictamen por ítem<\u002Fh1>\n    <p style=\"font-size:15px;line-height:1.62;color:rgba(255,255,255,.78);max-width:76ch;margin:0 0 18px;text-wrap:pretty\">Este tema no explica los índices: le pide operarlos sin equivocarse y decidir con ellos. Un ítem eliminado por un cálculo equivocado deja de existir, y nadie en la Clase 12 podrá echarlo de menos.<\u002Fp>\n    <div style=\"background:rgba(224,165,46,.16);border:1px solid rgba(224,165,46,.5);border-radius:12px;padding:15px 18px;max-width:74ch;margin-bottom:20px\">\n      <div style=\"font-size:10.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:#E0A52E;margin-bottom:7px\">Lo que resume el tema<\u002Fdiv>\n      <div style=\"font-size:18px;font-weight:700;color:#FFFFFF;line-height:1.4;text-wrap:pretty\">El código elimina el error aritmético. No elimina el error de planteamiento. Por eso se reproduce un caso de control antes de tocar sus datos.<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:flex;flex-wrap:wrap;gap:9px\">\n      <a href=\"#t4r1\" style=\"font-size:12.5px;font-weight:700;color:#16306B;background:#FFFFFF;padding:9px 16px;border-radius:100px\" style-hover=\"background:#EAF0FA\">4.1 Caso integrado<\u002Fa>\n      <a href=\"#t4r2\" style=\"font-size:12.5px;font-weight:700;color:#FFFFFF;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.28);padding:9px 16px;border-radius:100px\" style-hover=\"background:rgba(255,255,255,.2)\">4.2 El error que no se ve<\u002Fa>\n      <a href=\"#t4r3\" style=\"font-size:12.5px;font-weight:700;color:#FFFFFF;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.28);padding:9px 16px;border-radius:100px\" style-hover=\"background:rgba(255,255,255,.2)\">4.3 Seis casos de dictamen<\u002Fa>\n      <a href=\"#t4r4\" style=\"font-size:12.5px;font-weight:700;color:#FFFFFF;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.28);padding:9px 16px;border-radius:100px\" style-hover=\"background:rgba(255,255,255,.2)\">4.4 La dimensión B<\u002Fa>\n      <a href=\"#t4r5\" style=\"font-size:12.5px;font-weight:700;color:#FFFFFF;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.28);padding:9px 16px;border-radius:100px\" style-hover=\"background:rgba(255,255,255,.2)\">4.5 Plantilla del reporte<\u002Fa>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<section id=\"t4r1\" data-screen-label=\"4.1 Caso integrado\" style=\"padding:48px 0 0;background:#FFFFFF\">\n  <div style=\"max-width:1140px;margin:0 auto;padding:0 clamp(20px,4vw,40px)\">\n    <div style=\"display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:12px\">\n      <span style=\"font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:#1C4C96\">Recurso central del Tema 4 · caso integrado y reglas de dictamen<\u002Fspan>\n      <span style=\"font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:#16306B;background:#DCE6F7;border-radius:100px;padding:2px 9px\">Capa conceptual<\u002Fspan>\n      <span style=\"height:1px;flex:1;background:#E4E2DC\"><\u002Fspan>\n      <span style=\"font-size:11px;font-weight:700;color:#84838C;letter-spacing:.06em\">RA 8.5 · RA 8.6<\u002Fspan>\n    <\u002Fdiv>\n    <h2 style=\"font-size:clamp(23px,2.9vw,32px);font-weight:800;letter-spacing:-.02em;line-height:1.15;margin:0 0 12px;max-width:42ch\">4.1 · El caso integrado: práctica, control y plantilla<\u002Fh2>\n    <p style=\"font-size:15.5px;line-height:1.65;color:#45454F;max-width:78ch;margin:0 0 16px;text-wrap:pretty\">Ocho ítems del Caso T, cinco jueces, todos los índices. En modo <strong>Practicar<\u002Fstrong>, calcule a mano la V y el límite inferior de cada ítem y compruebe. Después descargue la hoja: trae las fórmulas a la vista, marca en rojo los límites inferiores bajo el umbral y las dimensiones por debajo del mínimo, y una hoja de control que le dice si Claude o jamovi reproducen estas cifras.<\u002Fp>\n\n    <div style=\"display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px\">\n      <sc-for list=\"{{ modes }}\" as=\"m\" hint-placeholder-count=\"3\">\n        <button sc-camel-on-click=\"{{ m.pick }}\" style=\"font-size:12.5px;font-weight:700;color:{{ m.col }};background:{{ m.bg }};border:1px solid {{ m.br }};padding:8px 14px;border-radius:100px;cursor:pointer;min-height:40px\">{{ m.n }}<\u002Fbutton>\n      <\u002Fsc-for>\n      <span style=\"flex:1\"><\u002Fspan>\n      <button sc-camel-on-click=\"{{ dlCaso }}\" style=\"font-size:12.5px;font-weight:700;color:#FFFFFF;background:#1C4C96;border:0;padding:10px 15px;border-radius:100px;cursor:pointer;min-height:40px\" style-hover=\"background:#16306B\">Caso integrado con fórmulas (.xlsx)<\u002Fbutton>\n      <button sc-camel-on-click=\"{{ dlVacio }}\" style=\"font-size:12.5px;font-weight:700;color:#16306B;background:#FFFFFF;border:1px solid #C9C7C0;padding:10px 15px;border-radius:100px;cursor:pointer;min-height:40px\">Plantilla vacía (.xlsx)<\u002Fbutton>\n    <\u002Fdiv>\n\n    <div style=\"overflow-x:auto;border:1px solid #E4E2DC;border-radius:14px\">\n      <sc-raw-table style=\"width:100%;border-collapse:collapse;min-width:1020px\">\n        <sc-raw-thead><sc-raw-tr style=\"background:#16306B\">\n          <sc-for list=\"{{ heads }}\" as=\"h\" hint-placeholder-count=\"14\">\n            <sc-raw-th style=\"text-align:{{ h.al }};padding:9px 8px;font-size:10px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:#FFFFFF;white-space:nowrap\">{{ h.t }}<\u002Fsc-raw-th>\n          <\u002Fsc-for>\n        <\u002Fsc-raw-tr>\n        <sc-if value=\"{{ showF }}\" hint-placeholder-val=\"{{ false }}\">\n          <sc-raw-tr style=\"background:#14182A\">\n            <sc-for list=\"{{ heads }}\" as=\"h\" hint-placeholder-count=\"14\">\n              <sc-raw-td style=\"padding:6px 8px;font-family:'JetBrains Mono',monospace;font-size:10px;line-height:1.35;color:#F2D38E;vertical-align:top;max-width:160px;word-break:break-all\">{{ h.f }}<\u002Fsc-raw-td>\n            <\u002Fsc-for>\n          <\u002Fsc-raw-tr>\n        <\u002Fsc-if>\n        <\u002Fsc-raw-thead>\n        <sc-raw-tbody>\n          <sc-for list=\"{{ rows }}\" as=\"r\" hint-placeholder-count=\"8\">\n            <sc-raw-tr>\n              <sc-raw-td style=\"padding:8px;font-family:'JetBrains Mono',monospace;font-size:12.5px;font-weight:700;color:#16306B;border-top:1px solid #EFEDE7\">{{ r.it }}<\u002Fsc-raw-td>\n              <sc-raw-td style=\"padding:8px;font-size:12px;color:#45454F;border-top:1px solid #EFEDE7;white-space:nowrap\">{{ r.dim }}<\u002Fsc-raw-td>\n              <sc-raw-td style=\"padding:8px;font-family:'JetBrains Mono',monospace;font-size:12.5px;text-align:center;border-top:1px solid #EFEDE7;letter-spacing:.08em\">{{ r.cal }}<\u002Fsc-raw-td>\n              <sc-raw-td style=\"padding:8px;font-family:'JetBrains Mono',monospace;font-size:12.5px;text-align:center;border-top:1px solid #EFEDE7\">{{ r.S }}<\u002Fsc-raw-td>\n              <sc-raw-td style=\"padding:6px 8px;text-align:center;border-top:1px solid #EFEDE7\">\n                <sc-if value=\"{{ r.prac }}\" hint-placeholder-val=\"{{ false }}\">\n                  <input value=\"{{ r.inV }}\" sc-camel-on-input=\"{{ r.setV }}\" placeholder=\"V\" inputmode=\"decimal\" style=\"width:64px;font-family:'JetBrains Mono',monospace;font-size:12.5px;text-align:center;padding:6px;border:1px solid {{ r.vBr }};background:{{ r.vBg }};border-radius:8px\">\n                <\u002Fsc-if>\n                <sc-if value=\"{{ r.notPrac }}\" hint-placeholder-val=\"{{ true }}\">\n                  <span style=\"font-family:'JetBrains Mono',monospace;font-size:12.5px;font-weight:700\">{{ r.V }}<\u002Fspan>\n                <\u002Fsc-if>\n              <\u002Fsc-raw-td>\n              <sc-raw-td style=\"padding:6px 8px;text-align:center;border-top:1px solid #EFEDE7;background:{{ r.lBg }}\">\n                <sc-if value=\"{{ r.prac }}\" hint-placeholder-val=\"{{ false }}\">\n                  <input value=\"{{ r.inL }}\" sc-camel-on-input=\"{{ r.setL }}\" placeholder=\"inf.\" inputmode=\"decimal\" style=\"width:64px;font-family:'JetBrains Mono',monospace;font-size:12.5px;text-align:center;padding:6px;border:1px solid {{ r.lBr }};background:{{ r.lIn }};border-radius:8px\">\n                <\u002Fsc-if>\n                <sc-if value=\"{{ r.notPrac }}\" hint-placeholder-val=\"{{ true }}\">\n                  <span style=\"font-family:'JetBrains Mono',monospace;font-size:12.5px;font-weight:700;color:{{ r.lCol }}\">{{ r.L }}<\u002Fspan>\n                <\u002Fsc-if>\n              <\u002Fsc-raw-td>\n              <sc-raw-td style=\"padding:8px;font-family:'JetBrains Mono',monospace;font-size:12.5px;text-align:center;border-top:1px solid #EFEDE7;color:#5A5A64\">{{ r.U }}<\u002Fsc-raw-td>\n              <sc-raw-td style=\"padding:8px;font-family:'JetBrains Mono',monospace;font-size:12.5px;text-align:center;border-top:1px solid #EFEDE7;background:{{ r.iBg }}\">{{ r.icvi }}<\u002Fsc-raw-td>\n              <sc-raw-td style=\"padding:8px;font-family:'JetBrains Mono',monospace;font-size:12.5px;text-align:center;border-top:1px solid #EFE n }}<\u002Fspan>\n          <span style=\"font-size:24px;font-weight:900;color:#16306B;font-variant-numeric:tabular-nums\">{{ g.v }}<\u002Fspan>\n          <span style=\"font-size:12px;font-weight:600;color:{{ g.c }};line-height:1.4;text-wrap:pretty\">{{ g.s }}<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:14px;margin-top:16px\">\n      <div style=\"background:#E7F4EF;border:1px solid rgba(29,158,117,.35);border-radius:14px;padding:16px 18px;display:flex;flex-direction:column;gap:6px\">\n        <div style=\"font-size:10.5px;font-weight:800;letter-spacing:.11em;text-transform:uppercase;color:#146B52\">Lo que este panel realmente hizo<\u002Fdiv>\n        <div style=\"font-size:14.5px;line-height:1.6;color:#0F3D2F;text-wrap:pretty\">Coincidió en calificar como relevante el 80 % de las asignaciones, y el 60 % de las cuarenta calificaciones fueron cuatros. La kappa de Fleiss de .189 es la paradoja del tema 3 con los números del caso. Y a la vez, el S-CVI/Ave de .85 y el S-CVI/UA de .625 dicen algo real: dos ítems arrastran el conjunto.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:#FDF6E7;border:1px solid rgba(224,165,46,.55);border-radius:14px;padding:16px 18px;display:flex;flex-direction:column;gap:6px\">\n        <div style=\"font-size:10.5px;font-weight:800;letter-spacing:.11em;text-transform:uppercase;color:#8A6410\">Regla de un minuto<\u002Fdiv>\n        <div style=\"font-size:14.5px;line-height:1.6;color:#4A3608;text-wrap:pretty\">Las reglas de dictamen son convención del diplomado, no un estándar publicado. Declárelas en su reporte como lo que son, y antes de ver sus resultados. El CVR, el CVR' y la κ* entran como evidencia convergente, nunca como veto aislado.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"t4r2\" data-screen-label=\"4.2 Error de planteamiento\" style=\"padding:56px 0 0;background:#FFFFFF\">\n  <div style=\"max-width:1140px;margin:0 auto;padding:0 clamp(20px,4vw,40px)\">\n    <div style=\"display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:12px\">\n      <span style=\"font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:#1C4C96\">Segundo recurso · apartado 1.4.1<\u002Fspan>\n      <span style=\"font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:#16306B;background:#DCE6F7;border-radius:100px;padding:2px 9px\">Capa conceptual<\u002Fspan>\n      <span style=\"height:1px;flex:1;background:#E4E2DC\"><\u002Fspan>\n      <span style=\"font-size:11px;font-weight:700;color:#84838C;letter-spacing:.06em\">RA 8.6<\u002Fspan>\n    <\u002Fdiv>\n    <h2 style=\"font-size:clamp(23px,2.9vw,32px);font-weight:800;letter-spacing:-.02em;line-height:1.15;margin:0 0 12px;max-width:42ch\">4.2 · Una salida impecable con un error que no se ve<\u002Fh2>\n    <p style=\"font-size:15.5px;line-height:1.65;color:#45454F;max-width:78ch;margin:0 0 16px;text-wrap:pretty\">Un alumno pidió a Claude el cálculo del caso integrado. El script se ejecutó sin errores y devolvió esto. Decida si lo daría por bueno; después corra el caso de control y localice la línea responsable.<\u002Fp>\n\n    <div style=\"display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start\">\n      <div style=\"flex:1 1 480px;min-width:0;background:#14182A;border-radius:16px;padding:14px 0;overflow-x:auto\">\n        <div style=\"display:flex;align-items:center;gap:8px;padding:0 16px 10px;border-bottom:1px solid #2A3352;margin-bottom:8px\">\n          <span style=\"font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:#8E9BBF\">indices.py · ejecutado<\u002Fspan>\n          <span style=\"flex:1\"><\u002Fspan>\n          <span style=\"font-size:11px;font-weight:700;color:#8E9BBF\">{{ codeHint }}<\u002Fspan>\n        <\u002Fdiv>\n        <sc-for list=\"{{ code }}\" as=\"c\" hint sc-raw-tr><\u002Fsc-raw-thead>\n            <sc-raw-tbody>\n              <sc-for list=\"{{ bugOut }}\" as=\"b\" hint-placeholder-count=\"8\">\n                <sc-raw-tr>\n                  <sc-raw-td style=\"padding:6px 10px;font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:700;color:#16306B;border-top:1px solid #EFEDE7\">{{ b.it }}<\u002Fsc-raw-td>\n                  <sc-raw-td style=\"padding:6px 10px;font-family:'JetBrains Mono',monospace;font-size:12px;text-align:right;border-top:1px solid #EFEDE7;color:{{ b.vc }}\">{{ b.V }}<span style=\"color:#8A211A;font-weight:700\">{{ b.vTrue }}<\u002Fspan><\u002Fsc-raw-td>\n                  <sc-raw-td style=\"padding:6px 10px;font-family:'JetBrains Mono',monospace;font-size:12px;text-align:right;border-top:1px solid #EFEDE7;color:{{ b.vc }}\">{{ b.ci }}<\u002Fsc-raw-td>\n                  <sc-raw-td style=\"padding:6px 10px;font-family:'JetBrains Mono',monospace;font-size:12px;text-align:right;border-top:1px solid #EFEDE7\">{{ b.icvi }}<\u002Fsc-raw-td>\n                  <sc-raw-td style=\"padding:6px 10px;font-family:'JetBrains Mono',monospace;font-size:12px;text-align:right;border-top:1px solid #EFEDE7\">{{ b.cvr }}<\u002Fsc-raw-td>\n                <\u002Fsc-raw-tr>\n              <\u002Fsc-for>\n            <\u002Fsc-raw-tbody>\n          <\u002Fsc-raw-table>\n        <\u002Fdiv>\n        <div style=\"font-size:12px;color:#84838C\">Pasos intermedios de I4 impresos por el script: media = 3.4 · V = .850 · nk = 20 · L = .640 · U = .948<\u002Fdiv>\n\n        <div style=\"background:#FAF9F5;border:1px solid #E4E2DC;border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:10px\">\n          <div style=\"font-size:13px;font-weight:800;color:#16306B\">Paso 1 · ¿Daría por buena esta salida para dictaminar?<\u002Fdiv>\n          <div style=\"display:flex;flex-wrap:wrap;gap:8px\">\n            <sc-for list=\"{{ p1ops }}\" as=\"o\" hint-placeholder-count=\"2\">\n              <button sc-camel-on-click=\"{{ o.pick }}\" style=\"flex:1 1 180px;text-align:left;font-size:13px;line-height:1.4;font-weight:600;color:{{ o.col }};background:{{ o.bg }};border:1px solid {{ o.br }};padding:10px 12px;border-radius:10px;cursor:pointer;min-height:44px\">{{ o.t }}<\u002Fbutton>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <sc-if value=\"{{ p1done }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"font-size:13px;line-height:1.55;color:#33333D;text-wrap:pretty\">{{ p1fb }}<\u002Fdiv>\n            <button sc-camel-on-click=\"{{ runCtl }}\" style=\"align-self:flex-start;font-size:13px;font-weight:700;color:#FFFFFF;background:#16306B;border:0;padding:10px 16px;border-radius:100px;cursor:pointer;min-height:44px\">Paso 2 · Ejecutar el control 1 con este script<\u002Fbutton>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <sc-if value=\"{{ ctlRun }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"margin-top:14px;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:10px\">\n        <div style=\"background:#F5F4F0;border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:3px\"><span style=\"font-size:10.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#45454F\">Control 1 · entrada<\u002Fspan><span style=\"font-family:'JetBrains Mono',monospace;font-size:13px;color:#1A1A22\">6 jueces · 4 4 4 3 3 3 · V correcta = .833<\u002Fspan><\u002Fdiv>\n        <div style=\"background:#E7F4EF;border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:3px\"><span style=\"font-size:10.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#146B52\">Resultado publicado<\u002Fspan><span style=\"font-family:'JetBrains Mono',monospace;font-size:20px;font-weight:800;color:#146B52\">[.608, .942]<\u002Fspan><\u002Fdiv>\n        <div style=\"background:#FDECEA;border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:3px\"><span style=\"font-size:10.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#8A211A\">Lo que devuelve el script<\u002Fspan><span style=\"font-family:'JetBrains Mono',monospace;font-size:20px;font-weight:800;color:#8A211A\">V = .875 · [.690, .957]<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"margin-top:10px;font-size:14px;line-height:1.6;color:#33333D;max-width:84ch;text-wrap:pretty\">No reproduce el control. Control 2 tampoco: para I4 devuelve V = .850 donde el manual da .800. <strong>Paso 3:<\u002Fstrong> haga clic en la línea del script que produce la diferencia.<\u002Fdiv>\n    <\u002Fsc-if>\n    <sc-if value=\"{{ lineFb }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"margin-top:12px;background:{{ lineBg }};border:1px solid {{ lineBr }};border-radius:14px;padding:14px 16px;font-size:14px;line-height:1.6;color:#1A1A22;text-wrap:pretty\">{{ lineTxt }}<\u002Fdiv>\n    <\u002Fsc-if>\n    <sc-if value=\"{{ found }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"margin-top:12px;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:14px\">\n        <div style=\"background:#ECF1FA;border:1px solid rgba(28,76,150,.25);border-radius:14px;padding:16px 18px;display:flex;flex-direction:column;gap:6px\">\n          <div style=\"font-size:10.5px;font-weight:800;letter-spacing:.11em;text-transform:uppercase;color:#1C4C96\">Error aritmético frente a error de planteamiento<\u002Fdiv>\n          <div style=\"font-size:14.5px;line-height:1.6;color:#1A1A22;text-wrap:pretty\">La aritmética del script es perfecta: cada división está bien hecha. Lo equivocado es la fórmula. El intérprete garantiza la primera cosa y no la segunda; sólo un resultado conocido delata la segunda.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background:#FDF6E7;border:1px solid rgba(224,165,46,.55);border-radius:14px;padding:16px 18px;display:flex;flex-direction:column;gap:6px\">\n          <div style=\"font-size:10.5px;font-weight:800;letter-spacing:.11em;text-transform:uppercase;color:#8A6410\">Por qué aquí no cambió el dictamen, y en su caso puede cambiar<\u002Fdiv>\n          <div style=\"font-size:14.5px;line-height:1.6;color:#4A3608;text-wrap:pretty\">Con estas ocho filas, las reglas producen el mismo dictamen por casualidad: I3 queda en .699, a una milésima del umbral, e I6 pasa de .667 a .750 en V pero cae igual por su I-CVI de .60. Con otra matriz, la inflación convierte «modificar» en «conservar» sin que nada lo advierta.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <div style=\"margin-top:22px;border:1px solid #E4E2DC;border-radius:16px;overflow:hidden\">\n      <div style=\"background:#FAF9F5;padding:14px 18px;display:flex;flex-wrap:wrap;align-items:center;gap:10px;border-bottom:1px solid #E4E2DC\">\n        <span style=\"font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:#8A6410;background:#FDF0D2;border-radius:100px;padding:2px 9px\">Capa procedimental · P-2026.10<\u002Fspan>\n        <span style=\"font-size:14px;font-weight:800;color:#16306B\">Calcular con Claude, verificar con jamovi<\u002Fspan>\n        <span style=\"flex:1\"><\u002Fspan>\n        <span style=\"font-size:11.5px;color:#84838C\">Revisar en cada ciclo; si su versión difiere, rige su versión.<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"padding:16px 18px;display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start\">\n        <div style=\"flex:1 1 440px;min-width:0;display:flex;flex-direction:column;gap:8px\">\n          <div style=\"display:flex;align-items:center;gap:8px\">\n            <span style=\"font-size:12px;font-weight:800;color:#16306B\">Prompt 8.A · cálculo de los índices<\u002Fspan>\n            <span style=\"flex:1\"><\u002Fspan>\n            <button sc-camel-on-click=\"{{ copyPrompt }}\" style=\"font-size:12px;font-weight:700;color:#FFFFFF;background:#1C4C96;border:0;padding:7px 13px;border-radius:100px;cursor:pointer;min-height:36px\">{{ copyLbl }}<\u002Fbutton>\n          <\u002Fdiv>\n          <div style=\"background:#14182A;border-radius:12px;padding:12px 14px;font-family:'JetBrains Mono',monospace;font-size:11.5px;line-height:1.6;color:#D9DEEA;white-space:pre-wrap;max-height:340px;overflow-y:auto\">{{ prompt }}<\u002Fdiv>\n          <div style=\"font-size:12.5px;line-height:1.5;color:#45454F;text-wrap:pretty\">Pida el cálculo y la interpretación en turnos separados. La afirmación de validez la escribe usted.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"flex:1 1 360px;min-width:0;display:flex;flex-direction:column;gap:10px\">\n          <div style=\"font-size:12px;font-weight:800;color:#16306B\">Si Claude y jamovi no coinciden · revise en este orden<\u002Fdiv>\n          <sc-for list=\"{{ causes }}\" as=\"c\" hint-placeholder-count=\"7\">\n            <label style=\"display:grid;grid-template-columns:24px minmax(0,1fr);gap:10px;align-items:start;cursor:pointer;min-height:32px\">\n              <input type=\"checkbox\" checked=\"{{ c.on }}\" sc-camel-on-change=\"{{ c.tog }}\" style=\"width:18px;height:18px;accent-color:#146B52;margin-top:2px\">\n              <span style=\"display:flex;flex-direction:column;gap:1px\"><span style=\"font-size:13px;font-weight:700;color:#1A1A22\">{{ c.t }}<\u002Fspan><span style=\"font-size:12px;color:#5A5A64\">{{ c.s }}<\u002Fspan><\u002Fspan>\n            <\u002Flabel>\n          <\u002Fsc-for>\n          <div style=\"font-size:12px;line-height:1.5;color:#5A5A64;background:#F5F4F0;border-radius:10px;padding:10px 12px;text-wrap:pretty\">jamovi: kappa de Cohen y de Fleiss no están en el módulo base; requieren un módulo de la biblioteca. V de Aiken, CVR e I-CVI no se calculan de forma nativa. Este recurso describe las funciones por lo que hacen y no reproduce rutas de menú.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"t4r3\" data-screen-label=\"4.3 Casos de dictamen\" style=\"padding:56px 0 0;background:#FFFFFF\">\n  <div style=\"max-width:1140px;margin:0 auto;padding:0 clamp(20px,4vw,40px)\">\n    <div style=\"display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:12px\">\n      <span style=\"font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:#1C4C96\">Tercer recurso · tabla de divergencias<\u002Fspan>\n      <span style=\"font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:#16306B;background:#DCE6F7;border-radius:100px;padding:2px 9px\">Capa conceptual<\u002Fspan>\n      <span style=\"height:1px;flex:1;background:#E4E2DC\"><\u002Fspan>\n      <span style=\"font-size:11px;font-weight:700;color:#84838C;letter-spacing:.06em\">RA 8.5<\u002Fspan>\n    <\u002Fdiv>\n    <h2 style=\"font-size:clamp(23px,2.9vw,32px);font-weight:800;letter-spacing:-.02em;line-height:1.15;margin:0 0 12px;max-width:42ch\">4.3 · Seis casos de dictamen: leer los índices juntos<\u002Fh2>\n    <p style=\"font-size:15.5px;line-height:1.65;color:#45454F;max-width:78ch;margin:0 0 16px;text-wrap:pretty\">Cada caso es una fila de la tabla de divergencias del manual. Vea las calificaciones y los índices, dictamine, y compare con el dictamen esperado y su razonamiento.<\u002Fp>\n\n    <div style=\"display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px\">\n      <sc-for list=\"{{ caseTabs }}\" as=\"t\" hint-placeholder-count=\"6\">\n        <button sc-camel-on-click=\"{{ t.pick }}\" style=\"font-size:12.5px;font-weight:700;color:{{ t.col }};background:{{ t.bg }};border:1px solid {{ t.br }};padding:8px 14px;border-radius:100px;cursor:pointer;min-height:40px\">{{ t.n }}<\u002Fbutton>\n      <\u002Fsc-for>\n      <span style=\"flex:1\"><\u002Fspan>\n      <span style=\"font-size:13px;font-weight:800;color:#16306B;align-self:center\">{{ caseScore }}<\u002Fspan>\n    <\u002Fdiv>\n\n    <div style=\"border:1px solid #E4E2DC;border-radius:16px;padding:18px 20px;display:flex;flex-direction:column;gap:14px\">\n      <div style=\"display:flex;flex-wrap:wrap;align-items:baseline;gap:10px\">\n        <span style=\"font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:#84838C\">{{ cs.esc }}<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"font-size:19px;font-weight:800;color:#16306B;line-height:1.3\">{{ cs.tit }}<\u002Fdiv>\n      <div style=\"display:flex;flex-wrap:wrap;gap:8px\">\n        <sc-for list=\"{{ cs.cals }}\" as=\"c\" hint-placeholder-count=\"5\">\n          <div style=\"display:flex;flex-direction:column;align-items:center;gap:2px;background:#F5F4F0;border-radius:10px;padding:8px 14px;min-width:56px\"><span style=\"font-size:10.5px;font-weight:800;color:#84838C\">{{ c.j }}<\u002Fspan><span style=\"font-size:22px;font-weight:900;color:#16306B\">{{ c.v }}<\u002Fspan><\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px\">\n        <sc-for list=\"{{ cs.ix }}\" as=\"x\" hint-placeholder-count=\"6\">\n          <div style=\"border:1px solid #E4E2DC;border-radius:10px;padding:8px 12px;display:flex;flex-direction:column;gap:1px\"><span style=\"font-size:10.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:#84838C\">{{ x.n }}<\u002Fspan><span style=\"font-family:'JetBrains Mono',monospace;font-size:15px;font-weight:700;color:#1A1A22\">{{ x.v }}<\u002Fspan><\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-wrap:wrap;gap:8px\">\n        <sc-for list=\"{{ cs.ops }}\" as=\"o\" hint-placeholder-count=\"3\">\n          <button sc-camel-on-click=\"{{ o.pick }}\" style=\"flex:1 1 200px;text-align:left;font-size:13.5px;line-height:1.4;font-weight:700;color:{{ o.col }};background:{{ o.bg }};border:1px solid {{ o.br }};padding:11px 14px;border-radius:12px;cursor:pointer;min-height:48px\">{{ o.t }}<\u002Fbutton>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <sc-if value=\"{{ cs.done }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:10px\">\n          <div style=\"background:{{ cs.fbBg }};border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:4px\"><span style=\"font-size:10.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:{{ cs.fbCol }}\">{{ cs.fbTag }}<\u002Fspan><span style=\"font-size:14px;line-height:1.55;color:#1A1A22;text-wrap:pretty\">{{ cs.sig }}<\u002Fspan><\u002Fdiv>\n          <div style=\"background:#ECF1FA;border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:4px\"><span style=\"font-size:10.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#1C4C96\">Qué hacer<\u002Fspan><span style=\"font-size:14px;line-height:1.55;color:#1A1A22;text-wrap:pretty\">{{ cs.hacer }}<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"t4r4\" data-screen-label=\"4.4 Dimension B\" style=\"padding:56px 0 0;background:#FFFFFF\">\n  <div style=\"max-width:1140px;margin:0 auto;padding:0 clamp(20px,4vw,40px)\">\n    <div style=\"display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:12px\">\n      <span style=\"font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:#1C4C96\">Cuarto recurso · reglas de dictamen y cobertura<\u002Fspan>\n      <span style=\"font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:#16306B;background:#DCE6F7;border-radius:100px;padding:2px 9px\">Capa conceptual<\u002Fspan>\n      <span style=\"height:1px;flex:1;background:#E4E2DC\"><\u002Fspan>\n      <span style=\"font-size:11px;font-weight:700;color:#84838C;letter-spacing:.06em\">RA 8.5 · ★ matiz<\u002Fspan>\n    <\u002Fdiv>\n    <h2 style=\"font-size:clamp(23px,2.9vw,32px);font-weight:800;letter-spacing:-.02em;line-height:1.15;margin:0 0 12px;max-width:42ch\">4.4 · El dictamen está listo. ¿Ya puede entregar?<\u002Fh2>\n    <div style=\"display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px\">\n      <sc-for list=\"{{ mcTabs }}\" as=\"t\" hint-placeholder-count=\"2\">\n        <button sc-camel-on-click=\"{{ t.pick }}\" style=\"font-size:12.5px;font-weight:700;color:{{ t.col }};background:{{ t.bg }};border:1px solid {{ t.br }};padding:8px 14px;border-radius:100px;cursor:pointer;min-height:40px\">{{ t.n }}<\u002Fbutton>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n    <div style=\"display:flex;flex-wrap:wrap;gap:18px;align-items:flex-start\">\n      <div style=\"flex:1 1 380px;min-width:0;display:flex;flex-direction:column;gap:10px\">\n        <p style=\"font-size:15px;line-height:1.65;color:#45454F;margin:0;text-wrap:pretty\">{{ mc.ctx }}<\u002Fp>\n        <sc-if value=\"{{ mc.isT }}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"display:flex;flex-direction:column;gap:8px\">\n            <sc-for list=\"{{ mc.items }}\" as=\"i\" hint-placeholder-count=\"4\">\n              <div style=\"display:flex;align-items:center;gap:10px;border:1px solid #E4E2DC;border-radius:12px;padding:10px 14px;opacity:{{ i.op }}\">\n                <span style=\"font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:700;color:#16306B;min-width:30px\">{{ i.it }}<\u002Fspan>\n                <span style=\"font-size:13px;color:#45454F;flex:1\">{{ i.why }}<\u002Fspan>\n                <span style=\"font-size:11.5px;font-weight:800;color:{{ i.c }};background:{{ i.b }};border-radius:100px;padding:3px 10px\">{{ i.d }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n            <div style=\"font-size:14px;font-weight:800;color:#8A211A\">Retenidos en la dimensión B: 2 · mínimo fijado en el Módulo II: 3<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ mc.isM }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"overflow-x:auto;border:1px solid #E4E2DC;border-radius:12px\">\n            <sc-raw-table style=\"width:100%;border-collapse:collapse;min-width:380px\">\n              <sc-raw-thead><sc-raw-tr style=\"background:#16306B\"><sc-raw-th style=\"text-align:left;padding:8px 10px;font-size:10px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:#FFFFFF\">Dominio<\u002Fsc-raw-th><sc-raw-th style=\"padding:8px 10px;font-size:10px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:#FFFFFF\">Recordar / Comprender<\u002Fsc-raw-th><sc-raw-th style=\"padding:8px 10px;font-size:10px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:#FFFFFF\">Aplicar<\u002Fsc-raw-th><sc-raw-th style=\"padding:8px 10px;font-size:10px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:#FFFFFF\">Analizar<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n              <sc-raw-tbody>\n                <sc-for list=\"{{ mc.grid }}\" as=\"g\" hint-placeholder-count=\"3\">\n                  <sc-raw-tr><sc-raw-td style=\"padding:8px 10px;font-size:12.5px;font-weight:700;color:#16306B;border-top:1px solid #EFEDE7\">{{ g.d }}<\u002Fsc-raw-td>\n                    <sc-for list=\"{{ g.c }}\" as=\"c\" hint-placeholder-count=\"3\">\n                      <sc-raw-td style=\"padding:8px 10px;text-align:center;font-family:'JetBrains Mono',monospace;font-size:14px;font-weight:800;color:{{ c.col }};background:{{ c.bg }};border-top:1px solid #EFEDE7\">{{ c.v }}<\u002Fsc-raw-td>\n                    <\u002Fsc-for>\n                  <\u002Fsc-raw-tr>\n                <\u002Fsc-for>\n              <\u002Fsc-raw-tbody>\n            <\u002Fsc-raw-table>\n          <\u002Fdiv>\n          <div style=\"font-size:11.5px;color:#84838C;margin-top:6px\">Conteos de la matriz: supuesto del caso. La celda marcada es la del reactivo R-9.3, el único de «Analizar» en la cláusula 9.<\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n      <div style=\"flex:1 1 400px;min-width:0;display:flex;flex-direction:column;gap:8px\">\n        <div style=\"font-size:13px;font-weight:800;color:#16306B\">{{ mc.q }}<\u002Fdiv>\n        <sc-for list=\"{{ mc.ops }}\" as=\"o\" hint-placeholder-count=\"4\">\n          <button sc-camel-on-click=\"{{ o.pick }}\" style=\"text-align:left;font-size:13.5px;line-height:1.45;font-weight:600;color:{{ o.col }};background:{{ o.bg }};border:1px solid {{ o.br }};padding:11px 14px;border-radius:12px;cursor:pointer;min-height:48px\">{{ o.t }}<\u002Fbutton>\n        <\u002Fsc-for>\n        <sc-if value=\"{{ mc.done }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"background:{{ mc.fbBg }};border-radius:12px;padding:12px 14px;font-size:14px;line-height:1.6;color:#1A1A22;text-wrap:pretty\">{{ mc.fb }}<\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"margin-top:16px;background:#FDECEA;border:1px solid rgba(179,38,30,.3);border-radius:14px;padding:16px 18px;display:flex;flex-direction:column;gap:6px\">\n      <div style=\"font-size:10.5px;font-weight:800;letter-spacing:.11em;text-transform:uppercase;color:#8A211A\">El error más caro<\u002Fdiv>\n      <div style=\"font-size:14.5px;line-height:1.6;color:#3D1410;text-wrap:pretty\">Un reporte que elimina sin verificar qué queda ha resuelto un problema y creado otro. La depuración empírica de la Clase 10 no puede recuperar una faceta que ningún ítem representó. Ésta es la razón de ser del excedente del banco.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"t4r5\" data-screen-label=\"4.5 Plantilla del reporte\" style=\"padding:56px 0 64px;background:#FFFFFF\">\n  <div style=\"max-width:1140px;margin:0 auto;padding:0 clamp(20px,4vw,40px)\">\n    <div style=\"display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:12px\">\n      <span style=\"font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:#1C4C96\">Quinto recurso · estructura del reporte<\u002Fspan>\n      <span style=\"font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:#16306B;background:#DCE6F7;border-radius:100px;padding:2px 9px\">Capa conceptual<\u002Fspan>\n      <span style=\"height:1px;flex:1;background:#E4E2DC\"><\u002Fspan>\n      <span style=\"font-size:11px;font-weight:700;color:#84838C;letter-spacing:.06em\">RA 8.1 · RA 8.5<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"display:flex;flex-wrap:wrap;align-items:flex-end;gap:14px;margin-bottom:16px\">\n      <div style=\"flex:1 1 420px\">\n        <h2 style=\"font-size:clamp(23px,2.9vw,32px);font-weight:800;letter-spacing:-.02em;line-height:1.15;margin:0 0 8px\">4.5 · Los once apartados, y el undécimo en dos versiones<\u002Fh2>\n        <p style=\"font-size:15.5px;line-height:1.65;color:#45454F;max-width:72ch;margin:0;text-wrap:pretty\">Descargue la plantilla editable. Antes, lea el apartado 11 en sus dos versiones y abra cada marca de la versión sobreafirmada: es donde más alumnos tropiezan.<\u002Fp>\n      <\u002Fdiv>\n      <button sc-camel-on-click=\"{{ dlRep }}\" style=\"font-size:13px;font-weight:700;color:#FFFFFF;background:#16306B;border:0;padding:11px 18px;border-radius:100px;cursor:pointer;min-height:44px\">Plantilla del reporte (.docx)<\u002Fbutton>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr));gap:8px;margin-bottom:18px\">\n      <sc-for list=\"{{ rep }}\" as=\"r\" hint-placeholder-count=\"11\">\n        <div style=\"display:grid;grid-template-columns:30px minmax(0,1fr);gap:8px;border:1px solid {{ r.br }};background:{{ r.bg }};border-radius:12px;padding:10px 12px\">\n          <span style=\"font-size:15px;font-weight:900;color:#16306B\">{{ r.n }}<\u002Fspan>\n          <span style=\"display:flex;flex-direction:column;gap:2px\"><span style=\"font-size:13px;font-weight:700;color:#1A1A22;line-height:1.35;text-wrap:pretty\">{{ r.t }}<\u002Fspan><span style=\"font-size:11.5px;color:#84838C\">{{ r.ra }}<\u002Fspan><\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:14px\">\n      <div style=\"border:1.5px solid rgba(29,158,117,.5);border-radius:16px;padding:16px 18px;display:flex;flex-direction:column;gap:10px\">\n        <div style=\"display:flex;align-items:center;gap:8px\"><span style=\"font-size:11px;font-weight:800;color:#FFFFFF;background:#146B52;border-radius:100px;padding:3px 10px\">Correcta<\u002Fspan><span style=\"font-size:12px;font-weight:700;color:#146B52\">Plantilla del manual, con su calificador<\u002Fspan><\u002Fdiv>\n        <div style=\"font-family:'Source Serif 4',Georgia,serif;font-size:15.5px;line-height:1.65;color:#1A1A22;text-wrap:pretty\">\n          <sc-for list=\"{{ okSeg }}\" as=\"s\" hint-placeholder-count=\"5\"><span style=\"background:{{ s.bg }};border-radius:4px;padding:{{ s.pad }}\">{{ s.t }}<\u002Fspan><\u002Fsc-for>\n        <\u002Fdiv>\n        <div style=\"font-size:12.5px;line-height:1.5;color:#45454F;text-wrap:pretty\">Nombra la fuente de evidencia por su nombre largo, la acota al uso y la población, y dice expresamente lo que no aporta.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"border:1.5px solid rgba(179,38,30,.45);border-radius:16px;padding:16px 18px;display:flex;flex-direction:column;gap:10px\">\n        <div style=\"display:flex;align-items:center;gap:8px\"><span style=\"font-size:11px;font-weight:800;color:#FFFFFF;background:#8A211A;border-radius:100px;padding:3px 10px\">Sobreafirmada<\u002Fspan><span style=\"font-size:12px;font-weight:700;color:#8A211A\">Contraejemplo redactado para el recurso · abra cada marca<\u002Fspan><\u002Fdiv>\n        <div style=\"font-family:'Source Serif 4',Georgia,serif;font-size:15.5px;line-height:1.65;color:#1A1A22;text-wrap:pretty\">\n          <sc-for list=\"{{ badSeg }}\" as=\"s\" hint-placeholder-count=\"12\"><span sc-camel-on-click=\"{{ s.pick }}\" style=\"background:{{ s.bg }};border-bottom:{{ s.bb }};cursor:{{ s.cur }};border-radius:3px\">{{ s.t }}<sup style=\"font-family:Inter,sans-serif;font-size:10px;font-weight:800;color:#8A211A\">{{ s.m }}<\u002Fsup><\u002Fspan><\u002Fsc-for>\n        <\u002Fdiv>\n        <div style=\"background:#FDECEA;border-radius:10px;padding:10px 12px;font-size:13.5px;line-height:1.55;color:#3D1410;min-height:44px;text-wrap:pretty\">{{ badNote }}<\u002Fdiv>\n        <div style=\"font-size:12px;font-weight:700;color:#8A211A\">{{ badCount }}<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<footer data-chrome=\"1\" style=\"background:#16306B;padding:26px 0\">\n  <div style=\"max-width:1140px;margin:0 auto;padding:0 clamp(20px,4vw,40px);display:flex;flex-wrap:wrap;gap:12px;align-items:center\">\n    <span style=\"font-size:12px;font-weight:700;color:rgba(255,255,255,.8)\">IEFPI · Diplomado 020-26 · Módulo IV · Unidad 1 · Tema 4<\u002Fspan>\n    <span style=\"flex:1\"><\u002Fspan>\n    <span style=\"font-size:11.5px;color:rgba(255,255,255,.6)\">Fuentes: AERA, APA y NCME (2014); Goodell et al. (2025); Penfield y Giacobbi (2004); Polit y Beck (2006); Tristán-López (2008)<\u002Fspan>\n  <\u002Fdiv>\n<\u002Ffooter>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nconst CASO = [['I1', 'A', [4, 4, 4, 4, 4]], ['I2', 'A', [4, 4, 4, 3, 4]], ['I3', 'A', [4, 3, 4, 4, 3]], ['I4', 'A', [4, 4, 3, 4, 2]], ['I5', 'B', [3, 3, 4, 3, 3]], ['I6', 'B', [4, 2, 3, 4, 2]], ['I7', 'B', [2, 3, 2, 4, 2]], ['I8', 'B', [4, 4, 4, 4, 4]]];\nconst HEADS = [['Ítem', 'left', 'Matriz!A4'], ['Dim.', 'left', 'Matriz!B4'], ['J1–J5', 'center', 'Matriz!C4:G4'], ['S', 'center', '=SUM(Matriz!C4:G4)-n_j*l_min'], ['V', 'center', '=C4/(n_j*k_r)'], ['IC inf.', 'center', '=(2*n_j*k_r*D4+z_c^2-z_c*SQRT(4*n_j*k_r*D4*(1-D4)+z_c^2))/(2*(n_j*k_r+z_c^2))'], ['IC sup.', 'center', 'ídem con + z_c*SQRT(…)'], ['I-CVI', 'center', '=COUNTIF(Matriz!C4:G4,\">=\"&cut_rel)/n_j'], ['κ*', 'center', '=(H4-I4)/(1-I4) · I4 = COMBIN(n_j,G4)*0.5^n_j'], ['n_e', 'center', '=COUNTIF(Matriz!C4:G4,\">=\"&cut_es)'], ['CVR', 'center', '=(K4-n_j/2)/(n_j/2)'], ['CVR\\'', 'center', '=K4/n_j'], ['Dictamen', 'left', '=IF(AND(E4>=umb_L,H4>=umb_ICVI,sin objeción),\"Conservar\",IF(OR(D4<umb_V,H4<=0.6),\"Eliminar\",\"Modificar\"))']];\nconst CODE = [\n  ['import math', 0], ['', 0], ['z = 1.959964                 # IC al 95 %', 1], ['k = 4                        # escala de 4 puntos', 2], ['', 0],\n  ['def aiken(r):', 0], ['    n = len(r)', 3], ['    media = sum(r) / n', 4], ['    return media / k             # V = X̄ / k', 5], ['', 0],\n  ['def wilson(V, nk, z):', 0], ['    a = 2*nk*V + z**2', 6], ['    b = z*math.sqrt(4*nk*V*(1-V) + z**2)', 6], ['    return (a-b)/(2*(nk+z**2)), (a+b)/(2*(nk+z**2))', 6], ['', 0],\n  ['for item, r in matriz.items():', 0], ['    V = aiken(r)', 0], ['    L, U = wilson(V, len(r)*k, z)', 7], ['    icvi = sum(x >= 3 for x in r) / len(r)', 8], ['    cvr = (sum(x == 4 for x in r) - len(r)/2) / (len(r)/2)', 8]\n];\nconst LINE_FB = {\n  1: [0, 'Correcta: z = 1.959964 es el valor del 95 % que pide el Prompt 8.A.'],\n  2: [1, 'Aquí está. k debe ser el rango de la escala (máximo − mínimo = 3), no el número de categorías. Y la forma de la media es (X̄ − l)/k con l = 1: el script omite l. Con esta línea, un panel que calificara todo con 1 obtendría V = .25 en lugar de 0, y todas las V salen infladas.'],\n  3: [0, 'Correcta: n = len(r) permite correr el control de seis jueces.'],\n  4: [0, 'Correcta: la media es la media. El problema no es la aritmética.'],\n  5: [1, 'Es la otra cara del mismo error: V = X̄ / k sólo sería correcta si la escala empezara en 0. La fórmula es (X̄ − l)/k, con l = 1 y k = 3. Corrija también la línea 4.'],\n  6: [0, 'Correcta: es el intervalo de Wilson tal como lo aplican Penfield y Giacobbi. Pero recibe una V inflada y un nk de 20.'],\n  7: [0, 'Propaga el error, no lo origina: nk = n·k da 20 en lugar de 15 porque k vale 4. Busque dónde se define k.'],\n  8: [0, 'Correctas: el I-CVI y el CVR no usan k, por eso coinciden con el manual. Es justo lo que hace engañosa la salida: la mitad de las columnas está bien.']\n};\nconst PROMPT = 'Actua como psicometra. NO calcules en el texto de tu respuesta: escribe un\\nscript en Python y EJECUTALO.\\nDATOS: matriz de 5 jueces por [N] items, escala de relevancia de 1 a 4.\\n[pegar la matriz: una fila por item, una columna por juez]\\nPARAMETROS EXPLICITOS (no los infieras):\\n   n = 5 jueces     l = 1 (minimo)     c = 4 categorias     k = c - 1 = 3\\n   z = 1.959964 para el IC al 95 %\\n   \"Relevante\" para el I-CVI = calificacion 3 o 4\\n   \"Esencial\" para el CVR = calificacion 4\\nCALCULA, por item:  S, V de Aiken, limite inferior y superior del IC\\n                    (metodo de Wilson / Penfield-Giacobbi), I-CVI, p_c, kappa\\n                    modificada, n_e, CVR, CVR\\'\\n            global: S-CVI/Average, S-CVI/UA, P_barra, P_e, kappa de Fleiss\\nIMPRIME los pasos intermedios de UN item completo, para que yo pueda\\nverificarlo a mano.\\nANTES de usar mis datos, ejecuta este CONTROL y muestrame el resultado:\\n   6 jueces, escala 1 a 4, V = .8333  ->  el IC correcto es [.608, .942]\\nSi no lo reproduces, detente y revisa el script.\\nNO interpretes todavia. NO propongas eliminar items. Solo calcula.';\nconst CAUSES = [['Orientación de la matriz: ítems en filas, jueces en columnas', 'Valores absurdamente distintos, no ligeramente'], ['Tratamiento nominal u ordinal de la escala', 'Difieren poco y de forma sistemática'], ['Variante de la fórmula: Fleiss o Light; ICC de consistencia o de acuerdo absoluto; pesos lineales o cuadráticos', 'Diferencia estable en la segunda o tercera cifra'], ['Faltantes y empates: cómo los trata cada programa', 'Difieren sólo si hay celdas vacías'], ['Redondeo intermedio', 'Diferencia en la tercera cifra decimal'], ['Recalcular a mano un ítem o un par de jueces', ''], ['Documentar la causa y el valor final en e
